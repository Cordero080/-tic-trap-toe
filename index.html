<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/loaders/FontLoader": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/FontLoader.js",
          "three/addons/geometries/TextGeometry": "https://unpkg.com/three@0.160.0/examples/jsm/geometries/TextGeometry.js"
        }
      }
    </script>
    <script type="module" src="./js/background.js"></script>
    <title>Tic-Trap-Toe</title>
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>

    <h1>Tic-Trap-Toe</h1>
    <h2 id="message">Rotate to play</h2>

    <div class="score-bar">
      <div class="score-side">
        <span class="score-label">X</span>
        <span class="score-num" id="score-x">0</span>
      </div>
      <div class="score-side">
        <span class="score-num" id="score-o">0</span>
        <span class="score-label">O</span>
      </div>
    </div>

    <div class="controls">
      <button id="reset-btn">Reset Game</button>
      <label>
        <input type="checkbox" id="vs-computer" />
        Play vs Computer
      </label>
    </div>

    <p class="copyright">© 2025 Pablo Cordero</p>
  </body>
</html>
